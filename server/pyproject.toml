[project]
name = "lattice-server"
version = "0.1.0"
description = "FastAPI backend and statistical engine for Lattice Lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "numpy>=1.26.0,<2.1.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "salib>=1.5.0",
    "statsmodels>=0.14.0",
    "pint>=0.24.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
