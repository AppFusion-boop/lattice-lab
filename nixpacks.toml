# Nixpacks configuration for Railway fallback
[phases.setup]
nixPkgs = ["python312", "nodejs_20", "curl", "git"]

[phases.install]
cmds = [
  "npm ci",
  "curl -LsSf https://astral.sh/uv/install.sh | sh",
  "export PATH=\"$HOME/.local/bin:$PATH\"",
  "uv sync --directory server --no-dev --frozen"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "export PATH=\"$HOME/.local/bin:$PATH\" && uv run --directory server uvicorn lattice_server.main:app --host 0.0.0.0 --port ${PORT:-8765}"

